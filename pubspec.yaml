name: bullsapp
description: "App de controle do robô BullsApp via Bluetooth (BLE)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_blue_plus: ^2.3.12
  iconsax: ^0.0.8
  provider: ^6.1.5+1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/robotbull.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "lib/assets/images/robotbull.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/robotbull.png
    - lib/assets/images/robot_view.png
    - lib/assets/icons/rapier.png
    - lib/assets/icons/discord.png
    - lib/assets/json/JOGADAS.json
    - lib/assets/json/PHYSICS.json
